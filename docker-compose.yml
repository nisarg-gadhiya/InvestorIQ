services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: investor-platform
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_DB_PATH=/app/chroma_data
    depends_on:
      - postgres
    volumes:
      - .:/app

  postgres:
    image: postgres:16-alpine
    container_name: investor-postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
